 */const Mr=T("X",[["path",{d:"M18 6 6 18",key:"1bl5f8"}],["path",{d:"m6 6 12 12",key:"d8bk6v"}]]),q={name:"Ermina Pierre",title:["Instructional Leader","IB MYP Coordinator","Educational Innovator"],statement:["Leading with Purpose.","Innovating with Intention.","Creating Lasting Impact."],position:"Instructional Facilitator, Magnet and Innovative Programs",district:"Broward County Public Schools",interviewDate:"Monday, November 2, 2026",headshot:"media/headshot.jpg",resumeUrl:"",email:"",linkedin:"",shareUrl:"https://panimre.github.io/profportfolio/",showReviewNotes:!1},kh="I have spent more than thirteen years helping students understand mathematics and helping teachers plan instruction that makes understanding possible. For about five of those years I have coordinated the IB Middle Years Program for roughly 800 students in grades 6–8, supporting teachers across all eight subject groups. My work sits where curriculum, professional learning, and program quality meet, and I am ready to bring that work to schools across the district.",Fo=["I began as a mathematics teacher, and the classroom is still where I measure every decision. Teaching math taught me that students rise to rigorous work when the path to understanding is designed with care: clear concepts, purposeful practice, and assessment that tells both teacher and student what to do next.","As IB MYP Coordinator, my work moved from one classroom to an entire program. I facilitate professional learning and collaborative planning across eight subject groups, support teachers in building concept-driven and inquiry-based units, coordinate documentation for program evaluation, and help families understand what the program offers their children."],_t=[{id:"equity",title:"Equitable Opportunity",body:"Innovative programs only matter if students can reach them. That means families who understand their options, recruitment that reaches every community, and support that helps students stay and succeed once they enroll."},{id:"excellence",title:"Instructional Excellence",body:"Program frameworks are only as strong as the daily instruction inside them. I focus on the unit, the lesson, and the assessment, because that is where a program becomes real for students."},{id:"educators",title:"Educator Development",body:"Teachers sustain programs, not coordinators. I design professional learning that builds lasting capacity: shared language, practical tools, and planning time that produces work teachers use the next day."},{id:"innovation",title:"Meaningful Innovation",body:"New tools and models earn their place by solving a real instructional problem. I ask what students and teachers need first, then choose the innovation that serves it."},{id:"sustain",title:"Sustainable Improvement",body:"Improvement that depends on one person ends when that person leaves. I build documentation, routines, and feedback cycles that a school can keep running and keep refining."}],Vu=[{id:"years",value:13,suffix:"+",label:"Years in education",kind:"accomplishment",categories:["Instructional Leadership"]},{id:"students",value:800,qualifier:"approx.",label:"Students in the IB program",kind:"responsibility",categories:["Program Development"]},{id:"groups",value:8,label:"Subject groups supported",kind:"responsibility",categories:["Professional Learning"]},{id:"teachers",value:50,qualifier:"approx.",label:"MYP teachers supported",kind:"responsibility",categories:["Professional Learning"]},{id:"docs",value:100,suffix:"+",label:"Evaluation documents coordinated",kind:"accomplishment",categories:["Program Development"]},{id:"events",value:15,suffix:"+",label:"Stakeholder events coordinated",kind:"accomplishment",categories:["Family Engagement"]},{id:"accel",value:70,suffix:"%",label:"Middle school math acceleration",kind:"accomplishment",categories:["Student Achievement"]}],Oo=[{id:"t-math",role:"Mathematics Teacher",setting:"Middle grades mathematics",years:"Years to confirm",summary:"Taught mathematics and contributed to strong school-level Algebra and Geometry outcomes and accelerated pathways for students.",carried:"A standard for rigor, and a habit of reading student data to decide what to teach next.",kind:"responsibility",badge:"Classroom Experience"},{id:"t-chair",role:"6th Grade Level Chair and 6th Grade Math Team Leader",setting:"Grade 6 team and grade 6 mathematics team",years:"Years to confirm",summary:"Led the sixth-grade level and the sixth-grade mathematics team at the same time.",carried:"Experience leading peers: running team meetings, aligning planning, and supporting colleagues.",kind:"responsibility"},{id:"t-coord",role:"IB MYP Program Coordinator",setting:"New Renaissance Middle School · about 800 students, grades 6–8",years:"About five years",summary:"Coordinate schoolwide MYP implementation, professional learning across eight subject groups, evaluation documentation, and family outreach.",carried:"Program-level systems thinking: how standards, documentation, teacher capacity, and communication fit together.",kind:"responsibility",current:!0},{id:"t-next",role:"Instructional Facilitator, Magnet and Innovative Programs",setting:"Broward County Public Schools",years:"Next",summary:"The next step I’m excited to take: bringing what I’ve built in one school to magnet and innovative programs across Broward County.",carried:"",kind:"proposed",future:!0}],$o=[{id:"la-pl",number:"01",icon:"users",title:"Professional Learning and Teacher Development",intro:"Designing and facilitating professional learning for teachers across eight subject groups.",highlights:["Design and facilitate biweekly professional learning sessions across eight MYP subject groups, addressing identified instructional needs and program expectations.","Develop differentiated training materials, instructional guides, and practical resources that help teachers apply IB MYP principles within their specific disciplines.","Lead professional learning on concept-driven instruction, inquiry-based learning, ATL skills, authentic assessment, and criterion-based assessment.","Coordinate ongoing IB training and onboarding support for teachers who are new to the MYP framework.","Facilitate collaborative planning opportunities that allow teachers to apply professional learning directly to their instructional units.","Identify areas requiring additional teacher support through planning discussions, instructional feedback, and reviews of program implementation."],impact:"Developing educators’ instructional knowledge and providing practical strategies that support stronger classroom implementation.",evidence:["ev-pd-plan","ev-pl-deck","ev-pd-agenda"]},{id:"la-curriculum",number:"02",icon:"layers",title:"Curriculum and Instructional Alignment",intro:"Designing the documents and tools that connect Florida standards to the IB framework, so every unit starts from a strong plan.",highlights:["Guide teachers in developing and refining MYP unit planners that connect Florida academic standards with key concepts, related concepts, global contexts, and statements of inquiry.","Coordinate the development and review of subject-group overviews to strengthen horizontal and vertical curriculum alignment across grades 6–8.","Support teachers in designing authentic summative assessments aligned with MYP objectives, assessment criteria, and intended learning outcomes.","Develop curriculum planning tools, reference guides, and instructional resources that establish consistent expectations across subject groups.","Facilitate interdisciplinary planning by helping teachers identify shared concepts, meaningful subject connections, and opportunities for integrated learning experiences.","Support the intentional integration of ATL skills, inquiry questions, and student reflection into unit planning and classroom instruction."],impact:"Unit plans that meet both Florida standards and IB expectations, built through one consistent planning process across all subject groups.",evidence:["ev-standards-ib","ev-atl-ll","ev-welcome-myp"]},{id:"la-coaching",number:"03",icon:"coaching",title:"Instructional Coaching and Continuous Improvement",intro:"Working alongside individual teachers to turn plans into effective classroom practice, and to keep improving it.",highlights:["Provide individualized instructional guidance to teachers on unit planning, conceptual understanding, inquiry-based instruction, and MYP assessment practices.","Review unit planners and instructional materials to identify strengths, address gaps, and provide actionable feedback for refinement.","Use teacher feedback, student performance information, and program implementation evidence to identify instructional priorities and areas requiring additional support.","Establish implementation goals, progress-monitoring checkpoints, and reflection opportunities through the annual IB Program Development Plan.","Support teachers in translating professional learning into classroom practice through collaborative planning, follow-up discussions, and targeted instructional resources.","Monitor progress toward program expectations, identify implementation challenges, and adjust professional learning and instructional support accordingly."],impact:"Teachers who use evidence from their own classrooms to make stronger instructional decisions, unit after unit.",evidence:["ev-planner-feedback","ev-pdp","ev-toddle"]}],Dt={id:"cs-coordinators",number:"05",title:"Building Leadership Capacity Across 11 Schools",short:"Supporting IB Coordinators Through Coaching, Collaboration, and Program Implementation",featured:!0,tag:"Closest to the Role",need:"IB coordinators are responsible for managing complex program requirements while supporting instructional practices across their schools. Coordinators, particularly those new to the role or preparing for program evaluation, benefit from individualized guidance, practical resources, and opportunities to collaborate with experienced colleagues.",responsibilities:["Provide individualized coaching and technical assistance to IB coordinators across 11 schools.","Support coordinators in interpreting program requirements, organizing documentation, and preparing for IB evaluation.","Strengthen coordinators’ ability to facilitate purposeful professional learning communities (PLCs).","Mentor and onboard newly appointed coordinators as they transition into program leadership."],actions:["Met directly with 11 coordinators representing 11 schools to provide guidance based on their individual program needs.","Shared evaluation documentation, planning templates, and organizational resources developed through my own coordination experience.","Reviewed coordinators’ program documentation and provided specific, actionable feedback to strengthen alignment with IB expectations.","Coached coordinators on structuring and facilitating effective PLCs that support teacher collaboration and instructional development.","Provided hands-on onboarding and mentorship to newly appointed coordinators, helping them understand their responsibilities and navigate program implementation."],evidence:["ev-coord-presentation","ev-onedrive"],impact:"Extended my leadership beyond a single school by providing direct support to 11 coordinators across 11 schools. Through individualized coaching, document review, resource sharing, and mentorship, I helped colleagues strengthen their understanding of program expectations, refine their documentation, and develop practical approaches to leading professional learning.",impactKind:"accomplishment",relevance:"This experience reflects the work of an Instructional Facilitator: assessing the needs of different schools, providing targeted support, developing leadership capacity, and promoting consistent program implementation. Supporting 11 coordinators has strengthened my ability to adapt guidance to different school contexts while maintaining shared expectations for program quality."},Hu=[{id:"pf-impl",title:"MYP implementation and coordination",body:"Coordinate schoolwide implementation of the IB Middle Years Program for about 800 students in grades 6–8."},{id:"pf-eval",title:"Evaluation preparation",body:"Coordinate evaluation requirements and organize program documentation with teachers and administrators."},{id:"pf-systems",title:"Implementation systems",body:"Build the documents, routines, and policies that let a program run consistently from year to year."},{id:"pf-interdisc",title:"Interdisciplinary planning",body:"Support interdisciplinary learning experiences that connect subject groups around shared concepts."},{id:"pf-tech",title:"Instructional technology",body:"Received recognition for high instructional technology usage and implementation. Leading the school’s Toddle rollout so every teacher is trained on the MYP planning platform by December 18, 2026."},{id:"pf-improve",title:"Continuous improvement",body:"Treat each evaluation, event, and planning cycle as information for the next one."}],ir={title:"Leading Schoolwide IB Program Evaluation",subtitle:"Coordinating Program Quality, Compliance, and Continuous Improvement",challenge:"Preparing for IB program evaluation required coordinating extensive documentation, aligning evidence with program standards, and ensuring that multiple departments contributed to a coherent picture of schoolwide implementation.",leadership:["Coordinated the preparation and organization of more than 100 evaluation documents.","Guided teachers and administrators in identifying, developing, and refining evidence aligned with IB standards and practices.","Established organizational structures to monitor documentation requirements, responsibilities, and completion.","Supported the development and review of unit planners, subject-group overviews, and program policies.","Used the evaluation process to identify implementation needs and inform future program development priorities."],significance:"This experience strengthened my ability to manage complex program requirements, coordinate multiple stakeholders, establish accountability structures, and connect evaluation findings to continuous improvement.",application:"The same leadership practices can support magnet and innovative programs across Broward County Public Schools through consistent implementation monitoring, targeted technical assistance, and evidence-based program development.",evidence:["ev-pdp","ev-eval-folder"]},un=[{id:"assess",label:"Assess Needs",schoolSummary:"Identify gaps in program implementation.",school:"Review IB standards and practices, unit planners, subject-group overviews, teacher feedback, student performance data, and existing program evidence to identify inconsistencies, instructional needs, and areas requiring additional support.",doSummary:"Understand each school’s program strengths, challenges, and opportunities.",district:"Conduct school visits, meet with administrators and program coordinators, review enrollment and performance trends, examine implementation evidence, and gather stakeholder feedback to identify barriers affecting program quality, access, and student experiences.",measure:"Every assigned school has a completed needs profile that combines visit notes, enrollment and performance trends, and stakeholder input, reviewed with school leadership."},{id:"priorities",label:"Establish Priorities",schoolSummary:"Translate identified needs into measurable program goals.",school:"Use findings from program reviews and stakeholder feedback to develop the annual Program Development Plan, establish improvement targets, identify responsible stakeholders, and determine timelines and evidence needed to monitor progress.",doSummary:"Develop targeted improvement plans aligned with each school’s needs.",district:"Collaborate with school leadership to establish measurable program goals, identify immediate and long-term priorities, determine necessary resources, assign responsibilities, and develop implementation timelines aligned with district expectations and program requirements.",measure:"Each school has a written improvement plan with measurable goals, named owners, and timelines, agreed on with its leadership team."},{id:"capacity",label:"Build Capacity",schoolSummary:"Equip educators to implement program expectations.",school:"Design biweekly professional learning across eight subject groups, develop subject-specific instructional resources, support new teacher onboarding, and provide targeted guidance on inquiry, conceptual teaching, ATL skills, and assessment practices.",doSummary:"Strengthen the ability of school teams to lead and sustain their programs.",district:"Provide individualized coaching to program coordinators, facilitate targeted professional learning, support new coordinator onboarding, develop practical implementation resources, and strengthen PLC structures that promote instructional collaboration and shared accountability.",measure:"Coordinators and school teams report growing confidence in leading their programs, and PLCs meet consistently with clear protocols and documented outcomes."},{id:"implement",label:"Implement",schoolSummary:"Turn program expectations into coordinated schoolwide action.",school:"Coordinate the development and implementation of MYP unit planners, subject-group overviews, assessment practices, program policies, and instructional initiatives. Work with department leaders and teachers to establish consistent procedures and responsibilities.",doSummary:"Support schools in translating improvement plans into consistent practice.",district:"Work alongside school teams to implement program initiatives, align curriculum and instructional expectations, establish operational procedures, coordinate available resources, and address challenges that arise during implementation.",measure:"Planned initiatives are underway on schedule, with consistent procedures and curriculum expectations visible in school documents and classrooms."},{id:"monitor",label:"Monitor",schoolSummary:"Evaluate implementation through evidence and feedback.",school:"Review unit planning progress, examine implementation artifacts, collect teacher and student feedback, monitor Program Development Plan milestones, and identify where classroom practices or program procedures require additional support.",doSummary:"Track program progress and provide responsive support.",district:"Conduct follow-up visits, review implementation milestones, examine enrollment and student performance trends, collect stakeholder feedback, and evaluate program evidence to determine progress toward established goals and identify schools requiring additional assistance.",measure:"Milestones are reviewed at regular follow-up visits, and schools that need more help are identified early and given targeted support."},{id:"refine",label:"Refine",schoolSummary:"Use findings to strengthen the next cycle of implementation.",school:"Provide actionable feedback, revise professional learning priorities, update planning tools and program procedures, and adjust implementation strategies based on evidence collected throughout the year.",doSummary:"Use evidence to strengthen program quality and long-term sustainability.",district:"Collaborate with school leaders to evaluate results, adjust improvement strategies, refine professional learning and resources, share effective practices across schools, and establish next steps that support continued program growth.",measure:"End-of-year reviews show progress toward each school’s goals, and effective practices are documented and shared across schools to shape next year’s plans."}],Wu=[{id:"cf-feeder",title:"Feeder-school engagement",body:"Lead a Feeder School Outreach Program, presenting to parents and students at feeder schools’ SAC meetings."},{id:"cf-info",title:"Parent information sessions",body:"Explain what the MYP is, how it shapes daily learning, and what it asks of students and families."},{id:"cf-nights",title:"Curriculum nights",body:"Organize and support curriculum events that bring families into classrooms and planning."},{id:"cf-comms",title:"Program communication",body:"Create school communication materials, including The IB Beacon newsletter."},{id:"cf-outreach",title:"Family outreach",body:"Support parent outreach and program awareness throughout the year, not only during recruitment season."},{id:"cf-partners",title:"Partnerships and collaboration",body:"Work with stakeholders to strengthen visibility and understanding of innovative programs."}],We={title:"Fall Into Curriculum Festival: Connecting Families to the Classroom",paragraphs:["Fall Into Curriculum Festival was designed to strengthen the connection between families, educators, and the academic experiences offered at New Renaissance Middle School. Rather than hosting a traditional informational event, I wanted to create an engaging opportunity for parents to experience the curriculum firsthand, interact with teachers, and gain a deeper understanding of what their children learn each day.","I led the planning and coordination of this schoolwide initiative, collaborating with administrators, teachers, and staff across eight subject groups to create a cohesive and meaningful experience. From establishing the event’s vision and coordinating departmental participation to organizing logistics and promoting family attendance, my focus was on making curriculum accessible, relevant, and engaging for families.","The event brought together more than 160 families, demonstrating the value of intentional outreach and collaborative planning. More importantly, it created opportunities to strengthen relationships between home and school, increase awareness of our academic program, and encourage greater family involvement in students’ educational experiences."],significance:"This initiative reflects my ability to transform an idea into a coordinated schoolwide experience, mobilize stakeholders around a shared purpose, and create meaningful opportunities for community engagement. These are skills I will bring to supporting magnet and innovative programs across Broward County Public Schools.",stages:[{id:"plan",label:"Plan",summary:"Establish the purpose and design the experience.",body:"Developed the event concept, established objectives centered on family engagement and curriculum awareness, and planned opportunities for parents to interact directly with teachers and explore the school’s academic programs."},{id:"coordinate",label:"Coordinate",summary:"Organize staff, resources, and event logistics.",body:"Collaborated with administrators, teachers, and support staff to coordinate participation across eight subject groups, establish expectations for presentations and activities, organize event logistics, and ensure a cohesive experience for attending families."},{id:"communicate",label:"Communicate",summary:"Generate family interest and encourage participation.",body:"Developed and coordinated event messaging to communicate the purpose, activities, and value of attending. Used school communication channels to promote the event and encourage families to engage with the school’s instructional programs."},{id:"host",label:"Host",summary:"Bring curriculum and family engagement together.",body:"Helped facilitate a schoolwide curriculum experience attended by more than 160 families, creating opportunities for parents to connect with educators, learn about academic expectations, and gain a clearer understanding of their children’s educational experiences."},{id:"follow",label:"Follow Up",summary:"Evaluate participation and identify opportunities for improvement.",body:"Review event participation, gather feedback from teachers and families where available, and identify opportunities to improve future curriculum events, strengthen family communication, and sustain engagement beyond a single evening."}],districtConnection:[{id:"awareness",label:"Magnet program awareness",body:"Families choose programs they understand. Clear, honest explanation of a program model is recruitment."},{id:"access",label:"Equitable access",body:"Outreach that reaches feeder schools and every community, not only families who already know to ask."},{id:"recruit",label:"Recruitment",body:"Events and materials that turn interest into informed applications."},{id:"retain",label:"Retention",body:"Families who understand the program stay connected to it, which helps students persist."}]},Uo=[{id:"m-years",value:13,suffix:"+",label:"Years in Education",kind:"accomplishment",categories:["Instructional Leadership","Student Achievement"]},{id:"m-coord",value:5,qualifier:"approx.",label:"Years of IB Program Coordination",kind:"responsibility",categories:["Program Development"]},{id:"m-groups",value:8,label:"Subject Groups Supported",kind:"responsibility",categories:["Professional Learning","Instructional Leadership"]},{id:"m-students",value:800,qualifier:"approx.",label:"Students Served by the IB Program",kind:"responsibility",categories:["Program Development"]},{id:"m-docs",value:100,suffix:"+",label:"Evaluation Documents Coordinated",kind:"accomplishment",categories:["Program Development"]},{id:"m-families",value:160,suffix:"+",label:"Families at One School Event",kind:"accomplishment",categories:["Family Engagement"]},{id:"m-events",value:15,suffix:"+",label:"Stakeholder Events Coordinated",kind:"accomplishment",categories:["Family Engagement","Innovation"]},{id:"m-accel",value:70,suffix:"%",label:"Mathematics Acceleration Rate",kind:"accomplishment",categories:["Student Achievement"]}],Vo=[{id:"a-schools",title:"Support for Other Schools",categories:["Program Development","Instructional Leadership"],kind:"accomplishment",summary:"Provided coaching, document review, and mentorship to 11 IB coordinators across 11 schools.",context:"Schools preparing for evaluation benefit from someone who has recently been through it.",contribution:"Met with each coordinator, shared evaluation documentation and templates, reviewed their program documen d how to make that preparation improve the program instead of interrupting it.",cycleTitle:"My Approach to Districtwide Program Development",cycleHint:"Click a stage to explore it. The cycle moves on its own until you do.",library:"Program documentation and outcomes"},community:{eyebrow:"Community Engagement and Recruitment",title:"Families choose what they understand",lede:"Program awareness is built through relationships with families, feeder schools, and the wider community, well before an application is due.",galleryTitle:"Events, outreach, and communication"},impact:{eyebrow:"Evidence of Impact",title:"What the work adds up to",lede:"These figures describe programs and outcomes I contributed to alongside teachers, students, families, and school leaders. Each entry below explains my specific part."},vision:{eyebrow:"My District-Level Leadership Vision",title:"From School-Based Leadership to Districtwide Impact",roadmapTitle:"The first ninety days"},contact:{eyebrow:"Resume and Contact",title:"Let’s continue the conversation"},present:{whoEyebrow:"Meet the leader",journeyEyebrow:"Leadership journey",journeyTitle:"Each role widened the view",instructionEyebrow:"Instructional leadership",instructionTitle:"Three leadership areas",evalEyebrow:"Featured case study",evalCaption:"documents prepared and organized",cycleEyebrow:"How I approach program development",familiesEyebrow:"Community engagement",familiesCaption:"families at one curriculum event",impactEyebrow:"Evidence of impact",visionEyebrow:"From school-based leadership to districtwide impact",roadmapEyebrow:"30-60-90 day leadership roadmap",closingEyebrow:"Thank you",qrCaption:"Scan to view the full portfolio"},closing:{statement:"An experienced instructional leader, ready to expand that impact across the district’s innovative programs."}},Ch={"bio.0":"My leadership experience spans mathematics instruction, curriculum development, professional learning, and schoolwide IB program coordination. With the experience I gained both in and out of the classroom, I understand the importance and processes of need-analysis, data collection and reflection in program development. I have supported educators across eight subject groups, strengthened instructional planning, and coordinated systems that connect program expectations to classroom practice.","bio.1":"As IB MYP Coordinator, my work moved from one classroom to an entire program. I facilitate professional learning and collaborative planning across eight subject groups, support teachers in building concept-driven and inquiry-based units, coordinate documentation for program evaluation, and help families understand what the program offers their children. Additionally, I have collaborated and supported colleagues at other schools with the development and implementation of their respective programs. I am prepared to apply that experience to helping schools strengthen their magnet and innovative programs, develop educator capacity, and expand meaningful opportunities for students.","heroMetrics.1.label":"Students currently being served in the IB program each year","heroMetrics.2.label":"Subject groups/disciplines supported","heroMetrics.3.label":"MYP teachers supported every year","heroMetrics.4.label":"Evaluation documents coordinated for IB Program Evaluation","heroMetrics.6.label":"Middle school acceleration rate achieved in 2016-2017 (highest in school's history to date)","impactMetrics.2.label":"Subject Groups/Disciplines Supported","impactMetrics.4.label":"Evaluation Documents Coordinated for IB Program Evaluation","philosophy.0.body":"Educational excellence begins with ensuring every student has access to challenging, meaningful learning experiences. True equity requires identifying and removing barriers, expanding opportunities, and creating pathways that allow all students to reach their full potential.","philosophy.1.body":"Sustainable instructional improvement begins with investing in educators. Providing meaningful professional learning, practical resources, and ongoing support empowers teachers to strengthen their practice, take ownership of their growth, and create lasting improvements in student learning.","philosophy.1.title":"Empowerment Through Capacity Building","philosophy.2.body":"Innovation is not simply about introducing something new. It is about challenging existing practices, identifying opportunities for improvement, and implementing purposeful solutions that strengthen instruction, enhance student experiences, and produce meaningful results.","philosophy.2.title":"Innovation With Intention","philosophy.3.body":"Effective leadership requires more than setting expectations; it requires examining progress and responding to results. Using data, stakeholder feedback, and intentional reflection allows us to celebrate successes, address challenges, and make informed decisions that drive continuous improvement.","philosophy.3.title":"Accountability Through Evidence and Reflection","philosophy.4.body":"Meaningful and lasting improvement is built through shared responsibility. Strong relationships, open communication, and collaborative decision-making create a culture where educators feel valued, stakeholders have a voice, and everyone takes ownership of student success.","philosophy.4.title":"Collective Leadership Through Collaboration","sections.instruction.lede":"Effective instructional leadership goes beyond providing resources or delivering professional development. It requires understanding teachers' needs, creating opportunities for meaningful collaboration, and ensuring that instructional expectations translate into classroom practice. Through intentional coaching, professional learning, and curriculum development, I work to strengthen instructional consistency while empowering educators to grow in their practice.","sections.instruction.title":"Strengthening Instruction by Empowering Educators","sections.meet.title":"From Classroom Impact to Districtwide Instructional Leadership","site.email":"panimre@gmail.com","site.linkedin":"https://www.linkedin.com/in/erminapierre/","timeline.0.carried":"Developed a strong foundation in curriculum design, differentiated instruction, data-driven decision-making, and student achievement. Learned to translate rigorous academic expectations into meaningful learning experiences while using assessment data to identify needs, adjust instruction, and support student growth.","timeline.0.summary":"Delivered rigorous, data-driven mathematics instruction, supported accelerated learning pathways, and contributed to improved student achievement in Algebra and Geometry.","timeline.0.years":"2014-2021","timeline.1.carried":"Experience leading peers: running team meetings, aligning planning, working as a liaison for schoolwide matters, and supporting colleagues.","timeline.1.role":"6th Grade Level Chair and 6th Grade Math Content Leader","timeline.1.years":"2018-2021","timeline.2.carried":"Expanded my leadership from classroom instruction to schoolwide program development, instructional coaching, and continuous improvement. Strengthened my ability to lead professional learning, coordinate complex initiatives, support educators across disciplines, and align program expectations with instructional practice.","timeline.2.years":"2021-Current","timeline.3.carried":"The ability to connect instructional expertise, program leadership, and collaborative problem-solving to support schools at a broader level. My experiences have prepared me to strengthen program implementation, build educator capacity, and expand access to innovative learning opportunities across the district.","copy.visionIntro":"Everything in this portfolio happened in one school. The facilitator role asks for an innovative approach to similar work across many schools, each with its own program model, community, and starting point. What carries over is a way of working: understand the school first, build capacity in the people who sustain the program, use evidence to decide what comes next, and make sure families can reach the opportunity.","curriculumNightCase.lede":`Fall Into Curriculum Night was designed to strengthen the connection between families, educators, and the academic experiences offered at New Renaissance Middle School. Rather than hosting a traditional informational event, I wanted to create an engaging opportunity for parents to experience the curriculum firsthand, interact with teachers, and gain a deeper understanding of what their children learn each day. I led the planning and coordination of this schoolwide initiative, collaborating with administrators, teachers, and staff across eight subject groups to create a cohesive and meaningful experience. From establishing the event's vision and coordinating departmental participation to organizing logistics and promoting family attendance, my focus was on making curriculum accessible, relevant, and engaging for families.

The event brought together **more than 160 families**, demonstrating the value of intentional outreach and collaborative planning. More importantly, it created opportunities to strengthen relationships between home and school, increase awareness of our academic programme, and encourage greater family involvement in students' educational experiences.

**Leadership Significance:** This initiative reflects my ability to transform an idea into a coordinated schoolwide experience, mobilize stakeholders around a shared purpose, and create meaningful opportunities for community engagement. These are skills I will bring to supporting magnet and innovative programmes across Broward County Public Schools.`,"curriculumNightCase.stages.3.body":"Helped facilitate a schoolwide curriculum experience attended by more than 160 families, creating opportunities for parents to connect with educators, learn about academic expectations, and gain a clearer understanding of their children’s educational experiences. The event was very well attended and included appearances from the Miramar Mayor, Vice Mayor, Commissioners, and Miramar Police Chief.","curriculumNightCase.title":"Fall into Curriculum Night: Engaging 160+ Families","impactMetrics.1.label":"Years of IB program coordination and leadership","impactMetrics.3.label":"Students served by the IB program per year","impactMetrics.7.label":"Middle School Acceleration Rate (2016-2017)","programFeatures.3.body":"Ensuring that programme expectations, access, inclusion, and implementation are supported by clear policies and procedures.","programFeatures.3.title":"Program Policies and Access","sections.community.title":"Bringing Innovative Programs to Life Through Family Engagement","sections.impact.lede":"My leadership is reflected in measurable student achievement, strengthened instructional practices, and meaningful programme improvements. Each accomplishment represents a commitment to turning challenges into opportunities, supporting educators, and creating lasting impact for students and school communities.","sections.impact.title":"Leadership Measured by Meaningful Results","sections.programs.lede":"Effective programme development requires more than meeting requirements. It involves establishing clear expectations, aligning resources and instructional practices, supporting implement
